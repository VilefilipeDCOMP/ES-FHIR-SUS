spring.application.name=fhirsus-gateway
server.port=8080

# Gerenciamento e Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Banco de Dados (PostgreSQL / H2)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fhirsus}
spring.datasource.username=${DB_USER:fhirsus}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Auditoria 
fhirsus.auditoria.usuario-fixo=sistema-demo

# Laboratorio Legado Mock 
lab.client.base-url=http://localhost:${server.port:8080}/mock/lab
lab.client.timeout-ms=5000
