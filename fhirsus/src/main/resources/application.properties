spring.application.name=fhir-sus-config
# Credenciais NUNCA no repositório: vêm de variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fhirsus}
spring.datasource.username=${DB_USER:fhirsus}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false
# Usuário fixo da auditoria até existir autenticação (ver TD-01/TD-02)
fhirsus.auditoria.usuario-fixo=sistema-demo
