spring.application.name=fhirsus-gateway
server.port=8080

# Gerenciamento e Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JPA / H2 em memoria para testes locais
spring.datasource.url=jdbc:h2:mem:fhirsus;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Laboratorio Legado Mock (P3 / RF016)
lab.client.base-url=http://localhost:8080/mock/lab
lab.client.timeout-ms=5000
