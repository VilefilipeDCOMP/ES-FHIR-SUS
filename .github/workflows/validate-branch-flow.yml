name: Validar fluxo de branches

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches: [dev, main]

permissions:
  contents: read

jobs:
  validate-branch-flow:
    name: Validar origem e destino
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Conferir branches do pull request
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        shell: bash
        run: |
          if [[ "$BASE" == "dev" && "$HEAD" == feature/* ]]; then
            msg="Fluxo permitido: \`feature/* -> dev\` (\`$HEAD_REPO:$HEAD -> $BASE_REPO:$BASE\`)"
            echo "$msg"
            echo "### Fluxo de branches válido" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$BASE" == "main" && "$HEAD" == "dev" && "$HEAD_REPO" == "$BASE_REPO" ]]; then
            msg="Fluxo permitido: \`dev -> main\` (\`$HEAD_REPO:$HEAD -> $BASE_REPO:$BASE\`)"
            echo "$msg"
            echo "### Fluxo de branches válido" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Fluxo de branches não permitido"
              echo ""
              echo "- Recebido: \`$HEAD_REPO:$HEAD -> $BASE_REPO:$BASE\`"
              echo "- Permitidos: \`feature/* -> dev\` e \`dev -> main\` (no mesmo repositório)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Fluxo não permitido: $HEAD_REPO:$HEAD -> $BASE_REPO:$BASE. Permitidos: feature/* -> dev e dev -> main (mesmo repositório)."
            exit 1
          fi
